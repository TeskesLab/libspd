name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: Quality / Rust ${{ matrix.toolchain }}
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        toolchain: ["1.81.0", stable]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.toolchain }}
          components: rustfmt, clippy
      - run: sh scripts/check.sh

  version:
    name: Validate package version
    # Gitea shares quality checks, not GitHub's native release services.
    if: github.server_url == 'https://github.com'
    runs-on: ubuntu-22.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Validate manifest versions
        id: version
        shell: bash
        run: |
          version="$(python scripts/release.py version)"
          printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"

  native:
    name: Native packages
    if: github.server_url == 'https://github.com'
    needs: version
    uses: ./.github/workflows/native.yml
    with:
      version: ${{ needs.version.outputs.version }}
