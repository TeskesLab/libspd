name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: Quality / Rust ${{ matrix.toolchain }}
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        toolchain: ["1.81.0", stable]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.toolchain }}
          components: rustfmt, clippy
      - run: sh scripts/check.sh

  version:
    name: Validate package version
    runs-on: ubuntu-22.04
    container: debian:bookworm-slim
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Install version validation tools
        run: |
          apt-get update
          apt-get install --no-install-recommends -y ca-certificates git python3
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Validate manifest versions
        id: version
        shell: bash
        run: |
          version="$(python3 scripts/release.py version)"
          printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"

  native:
    name: Native packages
    needs: version
    uses: ./.github/workflows/native.yml
    with:
      version: ${{ needs.version.outputs.version }}

  debian:
    name: Debian packages
    needs: version
    uses: ./.github/workflows/debian.yml
    with:
      version: ${{ needs.version.outputs.version }}

  mingw:
    name: Windows GNU cross-package
    needs: version
    uses: ./.github/workflows/mingw.yml
    with:
      version: ${{ needs.version.outputs.version }}
