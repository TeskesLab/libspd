[package]
name = "libspd-ffi"
version = "0.0.2"
edition = "2021"
rust-version = "1.81"
license = "Apache-2.0"
description = "C ABI for the hardware-independent libspd image library"
repository = "https://github.com/TeskesLab/libspd"
homepage = "https://github.com/TeskesLab/libspd"
documentation = "https://docs.rs/libspd-ffi"
keywords = ["spd", "memory", "ddr", "ffi"]
categories = ["parser-implementations", "external-ffi-bindings"]

[lib]
name = "spd"
crate-type = ["staticlib", "cdylib"]

[dependencies]
libspd = { version = "0.0.2", path = ".." }
